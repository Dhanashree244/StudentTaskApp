
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      margin: 0;
      padding: 30px 16px;
      color: #243047;
    }
    main {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    h1 { color: #2457a7; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #ccd4e0;
      border-radius: 6px;
    }
    button {
      padding: 11px 15px;
      border: 0;
      border-radius: 6px;
      background: #2457a7;
      color: white;
      cursor: pointer;
    }
    li {
      margin-top: 12px;
      padding: 12px;
      background: #f3f6fb;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }
    li button { margin-left: 8px; }
    .done { text-decoration: line-through; color: #64748b; }
    #message { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Student Task Manager</h1>
    <p>Add tasks, mark them complete, or delete them.</p>

    <form id="taskForm">
      <input id="taskInput" placeholder="Enter a task" required maxlength="200">
      <button type="submit">Add Task</button>
    </form>

    <p id="message" role="status"></p>
    <h2>My Tasks</h2>
    <ul id="taskList"></ul>
  </main>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const message = document.getElementById("message");

    let tasks = JSON.parse(localStorage.getItem("studentTasks") || "[]");

    function save() {
      localStorage.setItem("studentTasks", JSON.stringify(tasks));
      render();
    }

    function render() {
      list.replaceChildren();

      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = task.title;

        if (task.done) label.className = "done";

        const toggle = document.createElement("button");
        toggle.textContent = task.done ? "Undo" : "Complete";
        toggle.onclick = () => {
          tasks[index].done = !tasks[index].done;
          save();
        };

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.onclick = () => {
          tasks.splice(index, 1);
          save();
        };

        li.append(label, toggle, remove);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;

      tasks.push({ title, done: false });
      input.value = "";
      message.textContent = "";
      save();
    });

    render();
  </script>
</body>
</html>
